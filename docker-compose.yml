services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-asientos}
      MYSQL_USER: ${MYSQL_USER:-asientos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-asientos}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-asientos}
      DB_PASSWORD: ${MYSQL_PASSWORD:-asientos}
      DB_NAME: ${MYSQL_DATABASE:-asientos}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars-long}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
